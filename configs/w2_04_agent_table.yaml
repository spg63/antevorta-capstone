# W2-04 — the §9.2 ten-row agent-table reproduction (spec §9.2, §9.1).
#
# One config, one manifest, both epoch columns (plan §3-D2). n_runs is the spec §9.1
# default and is NOT a tunable here: "every reported number is a mean over 10 runs with
# standard deviation" — a smaller value makes this table not a result.
#
# labeled_sqlite is the W1-04 output and split_artifact is the one W1-05 fixed split.
# Both are required: runners never rebuild labels or split membership from raw inputs.
name: w2_04_agent_table
kind: w2_04_agent_table
seed: 20260810
n_runs: 10
params:
  labeled_sqlite: data/processed/movies.sqlite
  split_artifact: data/derived/split_v1.json
