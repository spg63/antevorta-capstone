# W2-03 §9.2 — the matched 5-agent reference crowd (explicit roster).
#
# Spec §9.2 crowd-level: "5 features — budget, vote_count, vote_average, runtime, popularity
# — five agents: four 2-feature agents each anchored on budget, one 5-feature agent." This is
# the deliberately-matched configuration W5-02 compares head-to-head against the monolithic
# MLP, so the roster is pinned EXACTLY via the explicit policy (not dealt), with the four
# 2-feature agents covering the four non-anchor features once each.
#
# `anchors: [budget]` is a validated invariant here, not a dealing instruction: every listed
# agent must contain budget (spec §5.1).
#
# COLUMN NAMES ARE NOW THE REAL ONES (W2-04, 2026-08-10). This file previously said
# `popularity`, tracking the spec's prose; the W1-03 ETL actually emits `tmdb_popularity`
# (see `wocbots.data.splits.DEFAULT_FEATURE_COLUMNS`), so every agent naming it raised
# `KeyError: feature 'popularity' is not in this dataset` on first contact with real data.
# The W2-03 unit tests never caught it because they build synthetic frames with their own
# column names. Verified against the real split by `test_w2_03_hollywood_configs_real_data`.
#
# The ANCHOR SET (`budget`) is still provisional: W1-06's RESULT block is blank, and its
# measured ranking on this snapshot puts budget LAST (r = 0.0224). Not re-anchored here —
# that is W1-06's ruling to make, not this config's.
name: crowd_hollywood_5agent

assignment:
  policy: explicit
  anchors: [budget]
  agents:
    - [budget, vote_count]
    - [budget, vote_average]
    - [budget, runtime]
    - [budget, tmdb_popularity]
    - [budget, vote_count, vote_average, runtime, tmdb_popularity]

classifier:
  variant: mlp
  epochs: 20
  hidden_width: 32

confidence_weights: {w_acc: 0.3, w_prec: 0.5, w_rec: 0.2}   # Hollywood biases precision (§5.4)
